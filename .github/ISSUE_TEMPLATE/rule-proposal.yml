name: 规则提案
description: 提议一条新的"AI 产物清退"规则（或指出某条规则误报）
title: "[rule] "
body:
  - type: markdown
    attributes:
      value: |
        谢谢提案。规则能不能落地，主要取决于三件事：**问题是否可判定**、**证据是否可靠**、**误报是否可接受**。
        请尽量用真实仓库里的例子，而不是设想中的例子。

  - type: input
    id: rule-name
    attributes:
      label: 规则名（建议）
      description: 形如 hygiene/your-rule，必须带 hygiene/ 前缀（账本按它匹配）。
      placeholder: hygiene/temporary-todo
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: 提案类型
      options:
        - 新增规则
        - 现有规则误报
        - 现有规则漏报
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 它认定的"问题"是什么
      description: 一句话说清。避免"感觉不对"这类无法判定的描述。
      placeholder: 代码里带过期日期的临时 TODO 注释，过期后仍留在仓库里。
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 证据从哪来
      description: 工具凭什么断定这是问题？路径解析、内容哈希、时间戳、引用图……
    validations:
      required: true

  - type: textarea
    id: false-positive
    attributes:
      label: 什么情况下会误报
      description: 这一项决定规则的默认级别（error / warn / info）。
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: 真实例子（文件路径 + 片段）
      description: 贴一段真实存在的代码或文档；没有真实例子的提案通常抓不到东西。
      render: text

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我确认这条规则不依赖网络，且可以用 `context.now` 做可复现的时间判断
        - label: 我确认这条规则在夹具目录（fixtures/samples/testdata）里会被整体跳过
        - label: 如果只能做到"疑似"，我接受默认级别不高于 warn
